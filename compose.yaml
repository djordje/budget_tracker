name: budget-tracker

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_DB: budget_tracker
      # Local-only convenience: never expose this database outside localhost.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
