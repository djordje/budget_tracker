{{define "content"}}
<section class="mx-auto max-w-5xl px-4 py-12 sm:px-6 sm:py-20">
  <div class="max-w-2xl">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-700">Dashboard</p>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-stone-950 sm:text-4xl">
      Welcome, {{.User.FirstName}}.
    </h1>
    <p class="mt-3 text-stone-600">You are signed in as {{.User.Email}}.</p>
  </div>

  <div class="mt-10 rounded-3xl border border-emerald-200 bg-emerald-50 p-6 sm:p-8">
    <h2 class="text-xl font-semibold text-emerald-950">Your account is ready</h2>
    <p class="mt-2 max-w-2xl leading-7 text-emerald-900">
      Household creation, membership roles, and household switching are the
      next part of this milestone.
    </p>
  </div>
</section>
{{end}}
