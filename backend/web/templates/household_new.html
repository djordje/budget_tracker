{{ define "content" }}
<section class="mx-auto max-w-md px-4 py-12 sm:px-6 sm:py-20">
	<a href="/app" class="text-sm font-semibold text-emerald-700 hover:text-emerald-800">&larr; Back to entries</a>
	<h1 class="mt-6 text-3xl font-bold tracking-tight text-stone-950 sm:text-4xl">Create household</h1>
	<p class="mt-3 text-stone-600">You will become the first admin. You can add more households later.</p>

	<form method="post" action="/app/households" class="mt-8 space-y-5">
		<input type="hidden" name="csrf_token" value="{{ .CSRF }}">
		<div>
			<label for="name" class="block text-sm font-semibold text-stone-800">Household name</label>
			<input id="name" name="name" type="text" value="{{ .Name }}" required maxlength="100" autocomplete="organization"
				class="mt-2 block w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 text-stone-900 shadow-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20">
			{{ with index .FieldErrors "name" }}<p class="mt-1 text-sm text-red-700">{{ . }}</p>{{ end }}
		</div>
		<button type="submit" class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white shadow-sm hover:bg-emerald-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2">
			Create household
		</button>
	</form>

	<p class="mt-6 text-sm text-stone-500">
		Currency defaults start as RSD and will be configurable with the finance settings.
	</p>
</section>
{{ end }}
