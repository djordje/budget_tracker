{{ define "content" }}
<section class="mx-auto max-w-md px-4 py-16 sm:px-6 sm:py-24">
	<p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-700">{{ .Status }}</p>
	<h1 class="mt-4 text-3xl font-bold tracking-tight text-stone-950 sm:text-4xl">{{ .Title }}</h1>
	<p class="mt-3 text-stone-600">{{ .Message }}</p>
	<a href="{{ if .ActiveHousehold }}{{ householdURL .ActiveHousehold.ID .SwitchDestination }}{{ else if .Authenticated }}/app{{ else }}/{{ end }}" class="mt-8 inline-flex items-center justify-center rounded-xl bg-emerald-700 px-5 py-3 font-semibold text-white shadow-sm hover:bg-emerald-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2">
		{{ if eq .CurrentPage "reports" }}Back to reports{{ else if eq .CurrentPage "exchange-rates" }}Back to exchange rates{{ else if .ActiveHousehold }}Back to entries{{ else }}Back to home{{ end }}
	</a>
</section>
{{ end }}
