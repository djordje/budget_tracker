{{define "alert_error"}}
{{with .}}<div role="alert" class="alert-error mt-6">{{.}}</div>{{end}}
{{end}}

{{define "field_error"}}
{{with .}}<p class="field-error">{{.}}</p>{{end}}
{{end}}

{{define "entry_empty_state"}}
<div class="mt-6 rounded-2xl border border-dashed border-stone-300 bg-white p-8 text-center">
  <h2 class="text-lg font-semibold text-stone-900">No {{.KindLabel}} entries yet</h2>
  <p class="mt-2 text-sm text-stone-600">Add your first entry to see it here.</p>
  <a href="{{.NewURL}}" class="btn-primary mt-5">Add {{.KindLabel}}</a>
</div>
{{end}}
