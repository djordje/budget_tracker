{{define "content"}}
<section class="mx-auto max-w-md px-4 py-12 sm:px-6 sm:py-20">
  <div>
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-700">Welcome back</p>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-stone-950 sm:text-4xl">Sign in</h1>
    <p class="mt-3 text-stone-600">Access your household budget.</p>
  </div>

  {{template "alert_error" .FormError}}

  <form method="post" action="/login" class="mt-8 space-y-5">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">

    <div>
      <label for="email" class="field-label">Email</label>
      <input id="email" name="email" type="email" value="{{.Email}}" autocomplete="username" required
             class="field-input">
    </div>

    <div>
      <label for="password" class="field-label">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="field-input">
    </div>

    <button type="submit" class="btn-primary w-full">
      Sign in
    </button>
  </form>

  <p class="mt-8 text-sm text-stone-600">
    New here?
    <a href="/register" class="font-semibold text-emerald-700 hover:text-emerald-800">Create an account</a>
  </p>
</section>
{{end}}
