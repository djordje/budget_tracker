version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - testifylint
    - unused
  settings:
    testifylint:
      # Decision 5 keeps independent expected-error checks nonfatal, which this
      # checker would reject by demanding require for every error assertion.
      disable:
        - require-error
