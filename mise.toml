[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.14.0"
watchexec = "2.8.0"
"go:github.com/gohugoio/gotmplfmt" = "0.5.0"

[env]
# Local overrides live in .env, which is ignored by git. Missing files are fine.
_.file = ".env"

[tasks.setup]
description = "Prepare the local development environment"
run = [
  "test -f .env || cp .env.example .env",
  "mise install",
  "mise run deps",
  "mise run assets:build",
  "mise run db:up",
  "mise run db:migrate",
]

[tasks.deps]
description = "Download Go modules and install frontend dependencies"
run = [
  "cd backend && go mod download",
  "cd backend && npm ci",
]

[tasks."css:build"]
description = "Compile Tailwind CSS"
run = "cd backend && npm run css:build"

[tasks."css:watch"]
description = "Rebuild Tailwind CSS while editing templates"
run = "cd backend && npm run css:watch"

[tasks."js:build"]
description = "Copy HTMX into the static assets"
run = "cd backend && npm run js:build"

[tasks."assets:build"]
description = "Compile CSS and copy browser JavaScript"
run = "cd backend && npm run assets:build"

[tasks.tidy]
description = "Tidy the Go module"
run = "cd backend && go mod tidy"

[tasks.format]
description = "Format Go source"
run = "cd backend && gofmt -w ."

[tasks."format:check"]
description = "Verify Go source is formatted"
run = """
cd backend
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Go files need formatting:" >&2
  echo "$files" >&2
  exit 1
fi
"""

[tasks."format:html"]
description = "Format Go HTML templates"
run = "cd backend && gotmplfmt -w web/templates/*.html"

[tasks."format:html:check"]
description = "Verify Go HTML templates are formatted"
run = """
cd backend || exit 1
files=$(gotmplfmt -l web/templates/*.html) || exit $?
if [ -n "$files" ]; then
  printf 'HTML templates need formatting (run mise run format:html):\\n%s\\n' "$files" >&2
  exit 1
fi
"""

[tasks.lint]
description = "Run static analysis"
run = [
  "cd backend && go vet ./...",
  "cd backend && go vet -tags=integration ./...",
  "cd backend && golangci-lint run ./...",
  "cd backend && golangci-lint run --build-tags=integration ./...",
]

[tasks.test]
description = "Run unit tests"
run = "cd backend && go test ./..."

[tasks.dev]
description = "Run the development HTTP server and watch Go, templates, and CSS"
depends = ["assets:build"]
run = [{ tasks = ["dev:server", "css:watch"] }]

[tasks."dev:server"]
description = "Rebuild and restart the development server on source changes"
hide = true
dir = "backend"
run = '''
mkdir -p bin
export WEB_STATIC_DIR="$PWD/web/static"
# Watch only the inputs that need a restart: Go source (including the embed
# files), templates, module files, and migrations. Generated assets and
# node_modules are excluded so Tailwind output does not churn the watcher.
watchexec --restart --no-meta \
  -w cmd -w internal -w web -w db -w go.mod -w go.sum \
  --exts go,html,mod,sum,sql -- \
  'go build -o bin/dev-server ./cmd/server && exec ./bin/dev-server'
'''

[tasks.build]
description = "Build the server executable"
depends = ["assets:build"]
run = "mkdir -p bin && cd backend && go build -trimpath -ldflags \"-s -w -X budgettracker/internal/version.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o ../bin/budget-tracker ./cmd/server"

[tasks."db:up"]
description = "Start local PostgreSQL"
run = "docker compose up -d --wait postgres"

[tasks."db:down"]
description = "Stop local PostgreSQL"
run = "docker compose down"

[tasks."db:logs"]
description = "Follow local PostgreSQL logs"
run = "docker compose logs -f postgres"

[tasks."db:migrate"]
description = "Apply pending database migrations"
run = "cd backend && go run ./cmd/migrate up"

[tasks."db:status"]
description = "Show applied and pending database migrations"
run = "cd backend && go run ./cmd/migrate status"

[tasks."db:reset"]
description = "Recreate the local database and apply migrations"
run = [
  "docker compose down -v",
  "mise run db:up",
  "mise run db:migrate",
]

[tasks."test:integration"]
description = "Run tests against PostgreSQL"
run = "cd backend && TEST_DATABASE_URL=\"${TEST_DATABASE_URL:-postgres://budget@localhost:5433/budget_tracker?sslmode=disable}\" go test -tags=integration ./..."

[tasks."hooks:install"]
description = "Enable the tracked pre-commit hook in this clone"
run = '''
if configured=$(git config --get core.hooksPath); then
  if [ "$configured" = ".githooks" ]; then
    echo "hooks:install: already enabled; nothing to do."
    exit 0
  fi
  echo "hooks:install: core.hooksPath is already set to '$configured'; leaving it unchanged." >&2
  echo "hooks:install: see: git config --show-origin core.hooksPath" >&2
  exit 1
elif [ "$?" -ne 1 ]; then
  exit 1
fi

git config --local core.hooksPath .githooks
echo "hooks:install: enabled .githooks/pre-commit for this clone."
echo "hooks:install: undo with: git config --local --unset core.hooksPath"
'''

[tasks.check]
description = "Run formatting, linting, tests, and a build"
run = [
  "mise run format:check",
  "mise run format:html:check",
  "mise run lint",
  "mise run test",
  "mise run build",
]

[tasks."check:all"]
description = "Run all checks, including PostgreSQL integration tests"
run = [
  "mise run format:check",
  "mise run format:html:check",
  "mise run lint",
  "mise run test",
  "mise run test:integration",
  "mise run build",
]
